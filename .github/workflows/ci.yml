name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  AETHERBOY_TEST_NATIVE_ONLINE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  verify:
    name: Windows / .NET 10 / Release
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            nanoboy/packages.lock.json
            nanoboy/Core/packages.lock.json
            nanoboy/Runtime/packages.lock.json
            frontends/AetherBoy.Desktop/packages.lock.json
            third_party/GBADotnet.Core/packages.lock.json
            tests/AetherBoy.SmokeTests/packages.lock.json
            tests/AetherBoy.CoreTests/packages.lock.json
            tests/AetherBoy.RuntimeTests/packages.lock.json
            tests/AetherBoy.DesktopTests/packages.lock.json
            tools/AetherBoy.Conformance/packages.lock.json
            tools/AetherBoy.GbaProbe/packages.lock.json
            tools/AetherBoy.OnlineProbe/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore .\nanoboy.sln --locked-mode --configfile .\NuGet.config

      - name: Build
        id: windows-build
        run: dotnet build .\nanoboy.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test browser bridge and room service
        run: node --test tests/browser/WebRtcBridge.test.cjs services/online-rooms/server.test.mjs

      - name: Smoke-test online connection probe CLI
        run: dotnet run --project .\tools\AetherBoy.OnlineProbe\AetherBoy.OnlineProbe.csproj --configuration Release --no-build --no-restore -- --help

      - name: Test Core
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 3
        run: dotnet test --project .\tests\AetherBoy.CoreTests\AetherBoy.CoreTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 271 --timeout 2m --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Core" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Core"

      - name: Test Runtime and native rooms
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 3
        run: dotnet test --project .\tests\AetherBoy.RuntimeTests\AetherBoy.RuntimeTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 646 --timeout 2m --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Runtime" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Runtime"

      - name: Test portable frontend logic
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        timeout-minutes: 3
        run: dotnet test --project .\tests\AetherBoy.DesktopTests\AetherBoy.DesktopTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 215 --timeout 2m --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Desktop" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Desktop"

      - name: Test Windows UI
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        # Run 34755810398 was still completing UI tests when the old 2m suite limit expired.
        # Keep both deadlines and the full test-count gate; do not skip or retry failures.
        timeout-minutes: 5
        run: dotnet test --project .\tests\AetherBoy.SmokeTests\AetherBoy.SmokeTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 344 --timeout 4m --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Smoke" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Smoke"

      - name: Retain Windows test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-diagnostics
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7

  portable:
    name: Linux / ${{ matrix.runner }} / Core + Runtime + Wayland
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            nanoboy/Core/packages.lock.json
            nanoboy/Runtime/packages.lock.json
            frontends/AetherBoy.Desktop/packages.lock.json
            third_party/GBADotnet.Core/packages.lock.json
            tests/AetherBoy.CoreTests/packages.lock.json
            tests/AetherBoy.RuntimeTests/packages.lock.json
            tests/AetherBoy.DesktopTests/packages.lock.json
            tools/AetherBoy.Conformance/packages.lock.json
            tools/AetherBoy.GbaProbe/packages.lock.json
            tools/AetherBoy.OnlineProbe/packages.lock.json

      - name: Build native online transport
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev
          bash scripts/build-online-native.sh

      - name: Restore Core tests
        run: dotnet restore ./tests/AetherBoy.CoreTests/AetherBoy.CoreTests.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore Runtime tests
        run: dotnet restore ./tests/AetherBoy.RuntimeTests/AetherBoy.RuntimeTests.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore conformance tool
        run: dotnet restore ./tools/AetherBoy.Conformance/AetherBoy.Conformance.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore own GBA probe
        run: dotnet restore ./tools/AetherBoy.GbaProbe/AetherBoy.GbaProbe.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore online connection probe
        run: dotnet restore ./tools/AetherBoy.OnlineProbe/AetherBoy.OnlineProbe.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore native Wayland host
        run: dotnet restore ./frontends/AetherBoy.Desktop/AetherBoy.Desktop.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore native Wayland frontend tests
        run: dotnet restore ./tests/AetherBoy.DesktopTests/AetherBoy.DesktopTests.csproj --locked-mode --configfile ./NuGet.config

      - name: Build Core tests
        id: linux-core-build
        run: dotnet build ./tests/AetherBoy.CoreTests/AetherBoy.CoreTests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build Runtime tests
        id: linux-runtime-build
        run: dotnet build ./tests/AetherBoy.RuntimeTests/AetherBoy.RuntimeTests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build conformance tool
        run: dotnet build ./tools/AetherBoy.Conformance/AetherBoy.Conformance.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build own GBA probe
        run: dotnet build ./tools/AetherBoy.GbaProbe/AetherBoy.GbaProbe.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build online connection probe
        run: dotnet build ./tools/AetherBoy.OnlineProbe/AetherBoy.OnlineProbe.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build native Wayland host
        run: dotnet build ./frontends/AetherBoy.Desktop/AetherBoy.Desktop.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build native Wayland frontend tests
        id: linux-desktop-build
        run: dotnet build ./tests/AetherBoy.DesktopTests/AetherBoy.DesktopTests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test Core
        if: ${{ !cancelled() && steps.linux-core-build.outcome == 'success' }}
        run: dotnet test --project ./tests/AetherBoy.CoreTests/AetherBoy.CoreTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 271 --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Core" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Core"

      - name: Test Runtime
        if: ${{ !cancelled() && steps.linux-runtime-build.outcome == 'success' }}
        run: dotnet test --project ./tests/AetherBoy.RuntimeTests/AetherBoy.RuntimeTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 646 --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Runtime" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Runtime"

      - name: Test browser bridge callbacks
        run: node --test tests/browser/WebRtcBridge.test.cjs services/online-rooms/server.test.mjs

      - name: Test native Wayland frontend logic
        if: ${{ !cancelled() && steps.linux-desktop-build.outcome == 'success' }}
        run: dotnet test --project ./tests/AetherBoy.DesktopTests/AetherBoy.DesktopTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 215 --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Desktop" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Desktop"

      - name: Smoke-test conformance CLI
        run: dotnet run --project ./tools/AetherBoy.Conformance/AetherBoy.Conformance.csproj --configuration Release --no-build -- --help

      - name: Smoke-test online connection probe CLI
        run: dotnet run --project ./tools/AetherBoy.OnlineProbe/AetherBoy.OnlineProbe.csproj --configuration Release --no-build --no-restore -- --help

      - name: Execute own GBA ARM / Mode 3 probe
        run: dotnet run --project ./tools/AetherBoy.GbaProbe/AetherBoy.GbaProbe.csproj --configuration Release --no-build --no-restore

      - name: Verify Hyprland platform profile without opening a window
        env:
          XDG_SESSION_TYPE: wayland
          XDG_CURRENT_DESKTOP: Hyprland
          WAYLAND_DISPLAY: wayland-ci
          HYPRLAND_INSTANCE_SIGNATURE: ci
        run: dotnet run --project ./frontends/AetherBoy.Desktop/AetherBoy.Desktop.csproj --configuration Release --no-build --no-restore -- --platform-info

      - name: Install headless Wayland compositor
        id: linux-compositor
        if: ${{ !cancelled() && steps.linux-desktop-build.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y weston desktop-file-utils libwayland-client0 libxkbcommon0 libegl1 libgl1 libdecor-0-0 libgtk-3-0t64 libatk-bridge2.0-0t64 at-spi2-core dbus-x11 python3-gi gir1.2-atspi-2.0

      - name: Test native UI and accessibility on isolated Wayland and D-Bus
        if: ${{ !cancelled() && steps.linux-desktop-build.outcome == 'success' && steps.linux-compositor.outcome == 'success' }}
        shell: bash
        # Direct MTP execution counts executed tests, excluding the three optional audio playtests.
        run: bash scripts/test-linux-headless.sh tests/AetherBoy.DesktopTests/bin/Release/net10.0/AetherBoy.DesktopTests.dll --minimum-expected-tests 212 --output Detailed --report-trx --results-directory "${{ github.workspace }}/artifacts/test-results/Headless" --diagnostic --diagnostic-synchronous-write --diagnostic-output-directory "${{ github.workspace }}/artifacts/test-results/Headless"

      - name: Verify Linux package scripts and publish
        run: |
          bash -n scripts/build-linux.sh scripts/run-linux.sh scripts/install-linux-user.sh scripts/launch-linux.sh scripts/uninstall-linux-user.sh scripts/package-linux.sh scripts/test-linux-headless.sh
          bash scripts/build-linux.sh
          python3 scripts/test-linux-install.py

      - name: Build and smoke-test self-contained Linux package
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) rid=linux-x64 ;;
            aarch64|arm64) rid=linux-arm64 ;;
            *) echo "Unsupported package architecture" >&2; exit 2 ;;
          esac
          bash scripts/package-linux.sh --runtime "$rid" --output "$RUNNER_TEMP/aetherboy-packages"

      - name: Retain Linux package for architecture testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-package-${{ matrix.runner }}
          path: ${{ runner.temp }}/aetherboy-packages/
          if-no-files-found: error
          retention-days: 7

      - name: Retain Linux test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-test-diagnostics-${{ matrix.runner }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7
