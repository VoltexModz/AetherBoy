name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  verify:
    name: Windows / .NET 10 / Release
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            nanoboy/packages.lock.json
            tests/AetherBoy.SmokeTests/packages.lock.json
            tests/AetherBoy.CoreTests/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore .\nanoboy.sln --locked-mode --configfile .\NuGet.config

      - name: Build
        run: dotnet build .\nanoboy.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test .\nanoboy.sln --configuration Release --no-build --no-restore --minimum-expected-tests 1
