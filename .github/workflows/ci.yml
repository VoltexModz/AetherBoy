name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  verify:
    name: Windows / .NET 10 / Release
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            nanoboy/packages.lock.json
            nanoboy/Core/packages.lock.json
            nanoboy/Runtime/packages.lock.json
            frontends/AetherBoy.Desktop/packages.lock.json
            third_party/GBADotnet.Core/packages.lock.json
            tests/AetherBoy.SmokeTests/packages.lock.json
            tests/AetherBoy.CoreTests/packages.lock.json
            tests/AetherBoy.RuntimeTests/packages.lock.json
            tests/AetherBoy.DesktopTests/packages.lock.json
            tools/AetherBoy.Conformance/packages.lock.json
            tools/AetherBoy.GbaProbe/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore .\nanoboy.sln --locked-mode --configfile .\NuGet.config

      - name: Build
        run: dotnet build .\nanoboy.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --solution .\nanoboy.sln --configuration Release --no-build --no-restore --minimum-expected-tests 440

  portable:
    name: Linux / Core + Runtime + native Wayland host
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            nanoboy/Core/packages.lock.json
            nanoboy/Runtime/packages.lock.json
            frontends/AetherBoy.Desktop/packages.lock.json
            third_party/GBADotnet.Core/packages.lock.json
            tests/AetherBoy.CoreTests/packages.lock.json
            tests/AetherBoy.RuntimeTests/packages.lock.json
            tests/AetherBoy.DesktopTests/packages.lock.json
            tools/AetherBoy.Conformance/packages.lock.json
            tools/AetherBoy.GbaProbe/packages.lock.json

      - name: Restore Core tests
        run: dotnet restore ./tests/AetherBoy.CoreTests/AetherBoy.CoreTests.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore Runtime tests
        run: dotnet restore ./tests/AetherBoy.RuntimeTests/AetherBoy.RuntimeTests.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore conformance tool
        run: dotnet restore ./tools/AetherBoy.Conformance/AetherBoy.Conformance.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore own GBA probe
        run: dotnet restore ./tools/AetherBoy.GbaProbe/AetherBoy.GbaProbe.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore native Wayland host
        run: dotnet restore ./frontends/AetherBoy.Desktop/AetherBoy.Desktop.csproj --locked-mode --configfile ./NuGet.config

      - name: Restore native Wayland frontend tests
        run: dotnet restore ./tests/AetherBoy.DesktopTests/AetherBoy.DesktopTests.csproj --locked-mode --configfile ./NuGet.config

      - name: Build Core tests
        run: dotnet build ./tests/AetherBoy.CoreTests/AetherBoy.CoreTests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build Runtime tests
        run: dotnet build ./tests/AetherBoy.RuntimeTests/AetherBoy.RuntimeTests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build conformance tool
        run: dotnet build ./tools/AetherBoy.Conformance/AetherBoy.Conformance.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build own GBA probe
        run: dotnet build ./tools/AetherBoy.GbaProbe/AetherBoy.GbaProbe.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build native Wayland host
        run: dotnet build ./frontends/AetherBoy.Desktop/AetherBoy.Desktop.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build native Wayland frontend tests
        run: dotnet build ./tests/AetherBoy.DesktopTests/AetherBoy.DesktopTests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test Core
        run: dotnet test --project ./tests/AetherBoy.CoreTests/AetherBoy.CoreTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 175

      - name: Test Runtime
        run: dotnet test --project ./tests/AetherBoy.RuntimeTests/AetherBoy.RuntimeTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 126

      - name: Test native Wayland frontend logic
        run: dotnet test --project ./tests/AetherBoy.DesktopTests/AetherBoy.DesktopTests.csproj --configuration Release --no-build --no-restore --minimum-expected-tests 15

      - name: Smoke-test conformance CLI
        run: dotnet run --project ./tools/AetherBoy.Conformance/AetherBoy.Conformance.csproj --configuration Release --no-build -- --help

      - name: Execute own GBA ARM / Mode 3 probe
        run: dotnet run --project ./tools/AetherBoy.GbaProbe/AetherBoy.GbaProbe.csproj --configuration Release --no-build --no-restore

      - name: Verify Hyprland platform profile without opening a window
        env:
          XDG_SESSION_TYPE: wayland
          XDG_CURRENT_DESKTOP: Hyprland
          WAYLAND_DISPLAY: wayland-ci
          HYPRLAND_INSTANCE_SIGNATURE: ci
        run: dotnet run --project ./frontends/AetherBoy.Desktop/AetherBoy.Desktop.csproj --configuration Release --no-build --no-restore -- --platform-info
